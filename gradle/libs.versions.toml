[versions]
# ── Core ───────────────────────────────────────────────────────────────────────
java                    = "21"
spring-boot             = "3.3.5"
spring-cloud            = "2023.0.3"
spring-dependency-mgmt  = "1.1.6"
kotlin                  = "1.9.25"

# ── DB ────────────────────────────────────────────────────────────────────────
postgresql              = "42.7.4"
hibernate-spatial       = "6.6.3.Final"
jts-core                = "1.19.0"

# ── Messaging ─────────────────────────────────────────────────────────────────
kafka                   = "3.8.0"

# ── Auth ──────────────────────────────────────────────────────────────────────
jjwt                    = "0.12.6"

# ── Utilities ─────────────────────────────────────────────────────────────────
lombok                  = "1.18.34"
mapstruct               = "1.5.5.Final"
resilience4j            = "2.2.0"

# ── AWS ───────────────────────────────────────────────────────────────────────
aws-sdk                 = "2.28.17"

# ── Test ──────────────────────────────────────────────────────────────────────
testcontainers          = "1.20.3"
wiremock                = "3.9.1"

[libraries]
# ── Spring Boot Starters ──────────────────────────────────────────────────────
spring-boot-starter                 = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web             = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webflux         = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-validation      = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-security        = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-actuator        = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-jpa             = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-mongodb         = { module = "org.springframework.boot:spring-boot-starter-data-mongodb" }
spring-boot-starter-redis           = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-redis-reactive  = { module = "org.springframework.boot:spring-boot-starter-data-redis-reactive" }
spring-boot-starter-cache           = { module = "org.springframework.boot:spring-boot-starter-cache" }
spring-boot-starter-batch           = { module = "org.springframework.boot:spring-boot-starter-batch" }
spring-boot-starter-elasticsearch   = { module = "org.springframework.boot:spring-boot-starter-data-elasticsearch" }
spring-boot-starter-oauth2          = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-test            = { module = "org.springframework.boot:spring-boot-starter-test" }

# ── Spring Cloud ──────────────────────────────────────────────────────────────
spring-cloud-gateway        = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }
spring-cloud-circuitbreaker = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j" }

# ── Spring Kafka ──────────────────────────────────────────────────────────────
spring-kafka                = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test           = { module = "org.springframework.kafka:spring-kafka-test" }

# ── DB Drivers ────────────────────────────────────────────────────────────────
postgresql                  = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hibernate-spatial           = { module = "org.hibernate.orm:hibernate-spatial" }
jts-core                    = { module = "org.locationtech.jts:jts-core", version.ref = "jts-core" }

# ── Auth ──────────────────────────────────────────────────────────────────────
jjwt-api                    = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl                   = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson                = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# ── Utilities ─────────────────────────────────────────────────────────────────
lombok                      = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct                   = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor         = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
resilience4j-spring         = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
resilience4j-reactor        = { module = "io.github.resilience4j:resilience4j-reactor", version.ref = "resilience4j" }
micrometer-prometheus       = { module = "io.micrometer:micrometer-registry-prometheus" }

# ── AWS ───────────────────────────────────────────────────────────────────────
aws-s3                      = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }
aws-sts                     = { module = "software.amazon.awssdk:sts", version.ref = "aws-sdk" }

# ── Test ──────────────────────────────────────────────────────────────────────
testcontainers-bom          = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql   = { module = "org.testcontainers:postgresql" }
testcontainers-mongodb      = { module = "org.testcontainers:mongodb" }
testcontainers-kafka        = { module = "org.testcontainers:kafka" }
testcontainers-elasticsearch = { module = "org.testcontainers:elasticsearch" }
testcontainers-localstack   = { module = "org.testcontainers:localstack" }
testcontainers-toxiproxy    = { module = "org.testcontainers:toxiproxy" }
wiremock                    = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
h2                          = { module = "com.h2database:h2" }
spring-batch-test           = { module = "org.springframework.batch:spring-batch-test" }
spring-security-test        = { module = "org.springframework.security:spring-security-test" }
reactor-test                = { module = "io.projectreactor:reactor-test" }

[bundles]
# 자주 함께 쓰이는 의존성 묶음
jpa-postgres    = ["spring-boot-starter-jpa", "postgresql"]
jwt             = ["jjwt-api", "jjwt-impl", "jjwt-jackson"]
mapstruct-full  = ["mapstruct", "mapstruct-processor"]
aws-s3-full     = ["aws-s3", "aws-sts"]
test-containers-all = ["testcontainers-postgresql", "testcontainers-mongodb", "testcontainers-kafka"]

[plugins]
spring-boot         = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dep-mgmt     = { id = "io.spring.dependency-management", version.ref = "spring-dependency-mgmt" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring       = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
