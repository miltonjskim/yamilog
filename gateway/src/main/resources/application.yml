spring:
  application:
    name: gateway

  # ── Routes ───────────────────────────────────────────────────────────────────
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "https://*.yamilog.com"
              - "http://localhost:3000"   # 로컬 개발
            allowedMethods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 3600

      routes:
        # ── user-service ────────────────────────────────────────────────────
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**,/api/v1/auth/**,/api/v1/follow/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        # ── category-service ────────────────────────────────────────────────
        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/api/v1/categories/**
          filters:
            - JwtAuthFilter

        # ── place-service ───────────────────────────────────────────────────
        - id: place-service
          uri: lb://place-service
          predicates:
            - Path=/api/v1/places/**
          filters:
            - JwtAuthFilter
            - name: CircuitBreaker
              args:
                name: place-cb
                fallbackUri: forward:/fallback/places

        # ── review-service ──────────────────────────────────────────────────
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/v1/reviews/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # ── feed-service ────────────────────────────────────────────────────
        - id: feed-service
          uri: lb://feed-service
          predicates:
            - Path=/api/v1/feeds/**
          filters:
            - JwtAuthFilter

        # ── search-service ──────────────────────────────────────────────────
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/v1/search/**
          filters:
            - JwtAuthFilter

        # ── ad-service ──────────────────────────────────────────────────────
        - id: ad-service
          uri: lb://ad-service
          predicates:
            - Path=/api/v1/ads/**
          filters:
            - JwtAuthFilter

  # ── Redis (Rate Limiter) ──────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

yamilog:
  jwt:
    secret: ${JWT_SECRET:changeme-in-production-use-256bit-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  metrics:
    tags:
      service: gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.yamilog: INFO
