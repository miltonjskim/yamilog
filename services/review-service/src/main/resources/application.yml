spring:
  application:
    name: review-service

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  data:
    mongodb:
      uri: mongodb://${MONGO_USER:yamilog}:${MONGO_PASS:yamilog}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:yamilog_review}?authSource=admin
      auto-index-creation: false   # 운영: 인덱스는 migration으로 관리

  # ── Redis ────────────────────────────────────────────────────────────────────
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}

  # ── Kafka ────────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: review-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.yamilog.*"

# ── AWS S3 (이미지 업로드) ───────────────────────────────────────────────────
yamilog:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET:yamilog-review-images}
      base-url: ${S3_BASE_URL:https://cdn.yamilog.com}
  review:
    max-images: 5
    max-image-size-mb: 10

server:
  port: ${SERVER_PORT:8084}
  tomcat:
    threads:
      max: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      service: review-service

logging:
  level:
    com.yamilog: INFO
    org.springframework.kafka: WARN

---
spring:
  config:
    activate:
      on-profile: local
  data:
    mongodb:
      auto-index-creation: true
logging:
  level:
    com.yamilog: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
