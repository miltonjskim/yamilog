spring:
  application:
    name: search-service
  elasticsearch:
    uris: http://${ES_HOST:localhost}:${ES_PORT:9200}
    connection-timeout: 5s
    socket-timeout: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 60000  # 1분 (자동완성 캐시)
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: search-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.yamilog.*"
server:
  port: ${SERVER_PORT:8087}
yamilog:
  search:
    place-index: yamilog-places
    review-index: yamilog-reviews
    autocomplete-size: 10
    default-page-size: 20
    max-page-size: 100
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      service: search-service
logging:
  level:
    com.yamilog: INFO
---
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    com.yamilog: DEBUG
    org.springframework.data.elasticsearch: DEBUG
